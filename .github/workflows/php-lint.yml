name: php-lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
      - name: php -l on all tracked PHP files
        run: |
          fail=0; n=0
          while IFS= read -r -d '' f; do
            n=$((n+1))
            out=$(php -l "./$f" 2>&1) || { echo "$out"; fail=1; }
          done < <(git ls-files -z '*.php')
          echo "$n PHP-filer sjekket"
          exit $fail
